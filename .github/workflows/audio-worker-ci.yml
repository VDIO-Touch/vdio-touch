name: Build and publish Audio Worker docker image
on:
  release:
    types: [published]
jobs:
  setup-build-publish:
    name: Setup, Build, and Publish Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Validate CalVer tag
        run: |
          echo "${{ github.event.release.tag_name }}" | grep -Eq "^[0-9]{4}\.[0-9]{2}\.[0-9]+$" || (echo "❌ Invalid CalVer tag. Expected format: YYYY.MM.PATCH (e.g. 2026.03.1)" && exit 1)

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: worker build and push to registry
        uses: docker/build-push-action@v5
        with:
          context: ./server/workers/audio-worker
          file: ./server/workers/audio-worker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/audio-worker:latest
            ${{ secrets.DOCKER_USERNAME }}/audio-worker:${{ github.event.release.tag_name }}
